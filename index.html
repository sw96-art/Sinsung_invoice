<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>신성어패럴 | 거래명세서</title>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#172235;background:#f4f6fa}*{box-sizing:border-box}body{margin:0}.shell{max-width:1080px;margin:32px auto;padding:0 18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:20px}.top h1{font-size:24px;margin:0}.sub{font-size:13px;color:#65748a;margin:6px 0 0}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #d3dae6;border-radius:9px;background:white;color:#172235;padding:11px 15px;font-size:14px;font-weight:700;cursor:pointer}button.primary{background:#1d4ed8;color:white;border-color:#1d4ed8}button:hover{filter:brightness(.96)}.paper{background:white;padding:36px 42px;box-shadow:0 8px 28px #23345212;border-radius:12px}.doc-title{text-align:center;font-size:29px;letter-spacing:9px;font-weight:800;margin:4px 0 30px}.meta{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}.field{display:flex;align-items:center;gap:12px;margin-bottom:12px}.field label{min-width:68px;font-weight:700;font-size:14px}input{border:1px solid #d4dbe7;border-radius:7px;padding:10px 11px;width:100%;font:inherit;background:white}input:focus{outline:2px solid #b6ccfa;border-color:#1d4ed8}.fixed{background:#f1f4f9;padding:10px 11px;border-radius:7px;flex:1}.table-scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{border:1px solid #cbd4e2;padding:7px;text-align:center;font-size:13px}th{background:#edf2fa;font-weight:750}td input{padding:8px 6px;border:1px solid transparent;text-align:center;min-width:0;border-radius:3px}td input:focus{border-color:#8caef6}td.amount{text-align:right;font-variant-numeric:tabular-nums;padding-right:12px}td .remove{padding:5px 8px;font-size:12px;color:#b91c1c}.total td{background:#f2f5fb;font-weight:800;font-size:16px;padding:14px}.bottom{display:flex;justify-content:space-between;align-items:center;margin-top:14px;gap:12px}.hint{color:#66748b;font-size:12px}.signature{text-align:right;margin-top:32px;font-weight:700}.print-only{display:none}@page{size:A4 portrait;margin:12mm}@media print{html,body{background:#fff!important;margin:0!important;color:#000}.shell{margin:0;max-width:none;padding:0}.top,.bottom,.hint,.remove-col,.no-print{display:none!important}.paper{box-shadow:none;padding:0;border-radius:0}.doc-title{margin:0 0 20px;font-size:24px}.meta{margin-bottom:16px}.field{margin-bottom:8px}.field input,.fixed{border:0!important;padding:5px 2px!important;background:none!important;color:#000;outline:0!important}.field label{min-width:54px}.table-scroll{overflow:visible}table{width:100%;table-layout:fixed}th,td{border-color:#333;padding:5px;font-size:11px}th{background:#f2f2f2!important;print-color-adjust:exact}td input{border:0;padding:2px 0;font-size:11px;color:#000}tr{break-inside:avoid}.total td{background:#f2f2f2!important;print-color-adjust:exact}.signature{margin-top:20px}}@media(max-width:650px){.shell{margin:16px auto;padding:0 10px}.paper{padding:20px 12px}.meta{grid-template-columns:1fr;gap:0}.doc-title{font-size:23px;letter-spacing:5px}table{min-width:650px}.actions{width:100%}.actions button{flex:1}}
</style>
</head><body><main class="shell"><header class="top"><div><h1>신성어패럴 거래명세서</h1><p class="sub">수신처와 납품 내역을 입력하면 A4 인쇄 및 엑셀 저장이 가능합니다.</p></div><div class="actions"><button type="button" onclick="window.print()">🖨️ A4 인쇄</button><button class="primary" type="button" id="excelBtn">⬇ 엑셀 다운로드</button><button class="primary" type="button" id="imageBtn">🖼 이미지 다운로드 (PNG)</button></div></header>
<p class="hint no-print"><a href="size.html" style="font-weight:800;color:#1d4ed8">사이즈별 납품명세서 (스타일 번호별 S~7XL) →</a></p><section class="paper" id="document"><h2 class="doc-title">거 래 명 세 서</h2><div class="meta"><div><div class="field"><label for="recipient">수신</label><input id="recipient" value="동신상사" placeholder="수신 업체명"></div><div class="field"><label for="issued">작성일</label><input id="issued" type="date"></div></div><div><div class="field"><label>발신</label><div class="fixed">신성어패럴</div></div><div class="field"><label>구분</label><div class="fixed">납품 거래명세</div></div></div></div>
<div class="table-scroll"><table aria-label="납품 거래내역"><colgroup><col style="width:19%"><col style="width:31%"><col style="width:12%"><col style="width:16%"><col style="width:17%"><col class="remove-col" style="width:5%"></colgroup><thead><tr><th>납품날짜</th><th>품목</th><th>수량</th><th>단가 (원)</th><th>합계 (원)</th><th class="remove-col">삭제</th></tr></thead><tbody id="items"></tbody><tfoot><tr class="total"><td colspan="4">총 합계</td><td class="amount" id="grandTotal">0</td><td class="remove-col"></td></tr></tfoot></table></div><div class="bottom"><button type="button" id="addRow">+ 품목 추가</button><span class="hint">수량 × 단가가 자동 계산됩니다. 금액은 원화 기준입니다.</span></div><div class="signature">발신: 신성어패럴</div></section><p class="hint no-print">※ 브라우저에서만 작동하며 입력 정보는 서버로 전송되지 않습니다. 엑셀 다운로드에는 인터넷 연결이 필요합니다. 인쇄 전 미리보기에서 A4·세로 방향을 확인하세요.</p></main>
<script>
const tbody=document.getElementById('items');const fmt=n=>Math.round(n).toLocaleString('ko-KR');const num=v=>Math.max(0,Number(String(v).replaceAll(',',''))||0);const today=new Date();document.getElementById('issued').value=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}-${String(today.getDate()).padStart(2,'0')}`;
function addRow(data={}){const tr=document.createElement('tr');tr.innerHTML=`<td><input aria-label="납품날짜" type="date" class="delivery"></td><td><input aria-label="품목" type="text" class="item" placeholder="품목 입력"></td><td><input aria-label="수량" type="number" class="qty" min="0" step="1" placeholder="0"></td><td><input aria-label="단가" type="number" class="price" min="0" step="1" placeholder="0"></td><td class="amount lineTotal">0</td><td class="remove-col"><button type="button" class="remove" aria-label="행 삭제">×</button></td>`;tbody.append(tr);tr.querySelector('.delivery').value=data.date||'';tr.querySelector('.item').value=data.item||'';tr.querySelector('.qty').value=data.qty??'';tr.querySelector('.price').value=data.price??'';tr.querySelectorAll('input').forEach(el=>el.addEventListener('input',calculate));tr.querySelector('.remove').addEventListener('click',()=>{tr.remove();if(!tbody.children.length)addRow();calculate()});calculate()}
function rows(){return [...tbody.querySelectorAll('tr')].map(tr=>({date:tr.querySelector('.delivery').value,item:tr.querySelector('.item').value,qty:num(tr.querySelector('.qty').value),price:num(tr.querySelector('.price').value)}))}
function calculate(){let total=0;[...tbody.children].forEach(tr=>{const n=num(tr.querySelector('.qty').value)*num(tr.querySelector('.price').value);tr.querySelector('.lineTotal').textContent=fmt(n);total+=n});document.getElementById('grandTotal').textContent=fmt(total)}
for(let i=0;i<10;i++)addRow();document.getElementById('addRow').addEventListener('click',()=>addRow());
const excelBtn=document.getElementById('excelBtn');excelBtn.addEventListener('click',async()=>{if(typeof ExcelJS==='undefined'){alert('엑셀 라이브러리를 불러오지 못했습니다. 인터넷 연결을 확인한 후 새로고침해 주세요.');return}excelBtn.disabled=true;excelBtn.textContent='엑셀 생성 중…';try{const wb=new ExcelJS.Workbook();const ws=wb.addWorksheet('거래명세서',{pageSetup:{paperSize:9,orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:1,margins:{left:.3,right:.3,top:.45,bottom:.45,header:.15,footer:.15}}});ws.columns=[{width:17},{width:31},{width:12},{width:18},{width:20}];ws.mergeCells('A1:E2');const title=ws.getCell('A1');title.value='거 래 명 세 서';title.font={name:'맑은 고딕',size:20,bold:true};title.alignment={horizontal:'center',vertical:'middle'};ws.getRow(1).height=24;ws.getRow(2).height=24;ws.getCell('A4').value='수신';ws.mergeCells('B4:C4');ws.getCell('B4').value=document.getElementById('recipient').value.trim()||'미입력';ws.getCell('D4').value='발신';ws.getCell('E4').value='신성어패럴';ws.getCell('A5').value='작성일';ws.mergeCells('B5:C5');ws.getCell('B5').value=document.getElementById('issued').value;ws.getCell('D5').value='구분';ws.getCell('E5').value='납품 거래명세';['납품날짜','품목','수량','단가 (원)','합계 (원)'].forEach((x,i)=>ws.getCell(7,i+1).value=x);const data=rows();data.forEach((r,i)=>{const n=8+i;ws.getCell(`A${n}`).value=r.date;ws.getCell(`B${n}`).value=r.item;ws.getCell(`C${n}`).value=r.qty;ws.getCell(`D${n}`).value=r.price;ws.getCell(`E${n}`).value={formula:`C${n}*D${n}`,result:r.qty*r.price};ws.getRow(n).height=24});const totalRow=8+data.length;ws.mergeCells(`A${totalRow}:D${totalRow}`);ws.getCell(`A${totalRow}`).value='총 합계';ws.getCell(`E${totalRow}`).value={formula:`SUM(E8:E${totalRow-1})`,result:data.reduce((s,r)=>s+r.qty*r.price,0)};ws.getRow(totalRow).height=30;ws.mergeCells(`D${totalRow+2}:E${totalRow+2}`);ws.getCell(`D${totalRow+2}`).value='발신: 신성어패럴';ws.getCell(`D${totalRow+2}`).alignment={horizontal:'right'};ws.eachRow((row,n)=>{row.eachCell({includeEmpty:true},cell=>{cell.font={name:'맑은 고딕',size:n===7?11:10,bold:n===7||n===totalRow||[4,5].includes(n)&&['A','D'].includes(cell.address.replace(/\d/g,''))};cell.alignment={vertical:'middle',horizontal:n>=7?'center':'left'};if(n>=7&&n<=totalRow){cell.border={top:{style:'thin',color:{argb:'FF8994A5'}},bottom:{style:'thin',color:{argb:'FF8994A5'}},left:{style:'thin',color:{argb:'FF8994A5'}},right:{style:'thin',color:{argb:'FF8994A5'}}}}if(n===7||n===totalRow)cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEAF0F8'}};if(n>=8&&n<=totalRow&&['C','D','E'].includes(cell.address[0]))cell.numFmt='#,##0';if(n>=8&&n<=totalRow&&['D','E'].includes(cell.address[0]))cell.alignment={horizontal:'right',vertical:'middle'};})});ws.printArea=`A1:E${totalRow+2}`;ws.headerFooter.oddFooter='&C신성어패럴 거래명세서';const buf=await wb.xlsx.writeBuffer();const blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);const name=(document.getElementById('recipient').value.trim()||'수신처').replace(/[\\/:*?"<>|]/g,'_');a.download=`거래명세서_${name}_신성어패럴.xlsx`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500)}catch(e){console.error(e);alert('엑셀 생성 중 오류가 발생했습니다. 다시 시도해 주세요.')}finally{excelBtn.disabled=false;excelBtn.textContent='⬇ 엑셀 다운로드'}});

// Export an A4-proportioned, input-free copy rather than a screenshot of the mobile editor.
const imageBtn=document.getElementById('imageBtn');
imageBtn.addEventListener('click',async()=>{
 if(typeof html2canvas==='undefined'){alert('이미지 변환 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');return;}
 imageBtn.disabled=true;imageBtn.textContent='이미지 생성 중…';
 const wrapper=document.createElement('div');
 try{
  wrapper.style.cssText='position:fixed;left:-10000px;top:0;width:794px;background:white;padding:45px 46px;box-sizing:border-box;z-index:-1;color:#172235;font-family:Arial,sans-serif';
  const doc=document.getElementById('document').cloneNode(true);
  doc.removeAttribute('id');doc.style.cssText='width:100%;padding:0;box-shadow:none;border-radius:0;background:white';
  doc.querySelector('.doc-title').style.cssText='text-align:center;font-size:28px;letter-spacing:8px;margin:5px 0 30px';
  doc.querySelector('.meta').style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:22px';
  doc.querySelector('.table-scroll').style.cssText='overflow:visible';
  doc.querySelector('table').style.cssText='width:100%;min-width:0;table-layout:fixed;border-collapse:collapse';
  doc.querySelectorAll('.remove-col').forEach(el=>el.remove());
  const cols=doc.querySelectorAll('col');
  ['20%','33%','12%','17%','18%'].forEach((v,i)=>{if(cols[i])cols[i].style.width=v});
  const originals=document.querySelectorAll('#document input');
  const clones=doc.querySelectorAll('input');
  clones.forEach((inp,i)=>{
   const src=originals[i];const span=document.createElement('span');
   let value=src.value||'';
   if(src.type==='number'&&value)value=Number(value).toLocaleString('ko-KR');
   span.textContent=value;
   span.style.cssText='display:block;width:100%;padding:8px 2px;font-size:13px;overflow-wrap:anywhere;text-align:'+(inp.closest('td')?'center':'left');
   inp.replaceWith(span);
  });
  doc.querySelectorAll('th,td').forEach(el=>{el.style.border='1px solid #667085';el.style.padding='8px 5px';el.style.fontSize='12px'});
  doc.querySelectorAll('th').forEach(el=>el.style.background='#edf2fa');
  doc.querySelectorAll('.total td').forEach(el=>el.style.background='#edf2fa');
  doc.querySelectorAll('.field').forEach(el=>el.style.cssText='display:flex;align-items:center;gap:12px;margin-bottom:12px');
  doc.querySelectorAll('.field label').forEach(el=>el.style.cssText='min-width:52px;font-weight:bold');
  doc.querySelectorAll('.fixed').forEach(el=>el.style.cssText='flex:1;padding:8px 2px;background:#fff');
  doc.querySelector('.bottom')?.remove();
  wrapper.append(doc);document.body.append(wrapper);
  const canvas=await html2canvas(wrapper,{backgroundColor:'#ffffff',scale:2,width:794,windowWidth:1100,scrollX:0,scrollY:0,logging:false});
  const blob=await new Promise(resolve=>canvas.toBlob(resolve,'image/png'));
  if(!blob)throw new Error('PNG 생성 실패');
  const name=(document.getElementById('recipient').value.trim()||'수신처').replace(/[\/:*?"<>|]/g,'_');
  const filename=`거래명세서_${name}_신성어패럴.png`;
  const file=new File([blob],filename,{type:'image/png'});
  // iPhone: sharing lets the user choose Save Image or send to KakaoTalk.
  if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&navigator.canShare?.({files:[file]})){
   try{await navigator.share({files:[file],title:filename});return;}catch(e){if(e.name==='AbortError')return;}
  }
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),3000);
 }catch(e){console.error(e);alert('이미지 저장에 실패했습니다. 새로고침 후 다시 시도해 주세요.');}
 finally{wrapper.remove();imageBtn.disabled=false;imageBtn.textContent='🖼 이미지 다운로드 (PNG)';}
});
</script></body></html>
