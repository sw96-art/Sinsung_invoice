<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>신성어패럴 사이즈별 납품명세서</title><script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script><script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script><style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#182438;font-family:system-ui,'Malgun Gothic',sans-serif}.wrap{max-width:1320px;margin:24px auto;padding:0 14px}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:16px}h1{font-size:23px;margin:0 0 6px}.muted{color:#64748b;font-size:13px}.buttons{display:flex;gap:8px;flex-wrap:wrap}button,.link{border:1px solid #cbd5e1;border-radius:8px;padding:10px 13px;background:#fff;color:#172235;font-weight:700;cursor:pointer;text-decoration:none;font-size:14px}.primary{background:#1d4ed8;color:white;border-color:#1d4ed8}.paper{background:white;border-radius:10px;padding:26px;box-shadow:0 6px 24px #1d2a4215}.title{text-align:center;font-size:26px;letter-spacing:4px;margin:6px 0 24px}.meta{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:18px}.field{display:flex;align-items:center;gap:10px;margin:6px 0}.field label{font-weight:700;min-width:58px}input{font:inherit;border:1px solid #cbd5e1;border-radius:5px;padding:8px;width:100%;background:white}.meta input{width:200px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:1120px;table-layout:fixed}th,td{border:1px solid #b9c6d8;text-align:center;padding:6px 3px;font-size:12px}th{background:#eaf0f8}td input{border:0;text-align:center;padding:6px 2px;min-width:0;font-size:12px}td input:focus{outline:2px solid #a6c1fc}td input[type=number]{appearance:textfield}.total td{font-weight:800;background:#eef3fb}.row-actions{display:flex;justify-content:space-between;align-items:center;margin-top:14px}.small{font-size:12px;color:#64748b}.delete{color:#b91c1c;padding:5px}.signature{text-align:right;margin-top:24px;font-weight:700}@page{size:A4 landscape;margin:9mm}@media print{body{background:white}.wrap{margin:0;padding:0;max-width:none}.top,.row-actions,.no-print,.delete-col{display:none!important}.paper{padding:0;box-shadow:none;border:0}.title{font-size:19px;margin:0 0 12px}.meta{margin-bottom:10px}.meta input{width:160px}.field{font-size:11px}.field input{border:0;padding:0}.scroll{overflow:visible}table{min-width:0;width:100%}th,td{font-size:8px;padding:3px 1px;border-color:#555}td input{font-size:8px;padding:2px 0}th,.total td{print-color-adjust:exact}.signature{font-size:10px;margin-top:12px}tr{break-inside:avoid}}@media(max-width:600px){.paper{padding:14px}.title{font-size:20px}.buttons>*{flex:1}.meta input{width:160px}}
</style><style>.site-nav{display:flex;gap:10px;margin:0 0 18px;flex-wrap:wrap}.site-nav a{display:inline-block;padding:13px 18px;border-radius:9px;border:2px solid #1d4ed8;color:#1d4ed8;background:#fff;text-decoration:none;font-size:15px;font-weight:800}.site-nav a.active{background:#1d4ed8;color:#fff}@media print{.site-nav{display:none!important}}</style></head><body><main class="wrap"><nav class="site-nav no-print" aria-label="명세서 종류"><a href="index.html" class="">일반 거래명세서</a><a href="size.html" class="active">사이즈별 납품명세서 (S~7XL)</a></nav><header class="top"><div><h1>신성어패럴 사이즈별 납품명세서</h1><div class="muted">품목 · 스타일 번호별 S~7XL 수량 관리 (금액 없음)</div></div><div class="buttons"><a class="link" href="index.html">일반 거래명세서</a><button onclick="window.print()">🖨 A4 가로 인쇄</button><button id="excel" class="primary">⬇ 엑셀 다운로드</button><button id="png" class="primary">🖼 PNG 다운로드</button></div></header><section class="paper" id="document"><h2 class="title">사 이 즈 별 납 품 명 세 서</h2><div class="meta"><div><div class="field"><label>수신</label><input id="recipient" value="동신상사"></div><div class="field"><label>작성일</label><input id="issued" type="date"></div></div><div><div class="field"><label>발신</label><strong>신성어패럴</strong></div><div class="field"><label>구분</label><span>사이즈별 납품명세</span></div></div></div><div class="scroll"><table id="tbl"><colgroup><col style="width:9%"><col style="width:13%"><col style="width:13%"><col span="10" style="width:5.2%"><col style="width:8%"><col class="delete-col" style="width:5%"></colgroup><thead><tr><th>납품날짜</th><th>품목</th><th>스타일 번호</th><th>S</th><th>M</th><th>L</th><th>XL</th><th>2XL</th><th>3XL</th><th>4XL</th><th>5XL</th><th>6XL</th><th>7XL</th><th>총수량</th><th class="delete-col">삭제</th></tr></thead><tbody id="items"></tbody><tfoot><tr class="total"><td colspan="3">사이즈별 합계</td><td id="sum0">0</td><td id="sum1">0</td><td id="sum2">0</td><td id="sum3">0</td><td id="sum4">0</td><td id="sum5">0</td><td id="sum6">0</td><td id="sum7">0</td><td id="sum8">0</td><td id="sum9">0</td><td id="grand">0</td><td class="delete-col"></td></tr></tfoot></table></div><div class="row-actions"><button id="add">+ 스타일 추가</button><span class="small">같은 품목도 스타일 번호별로 별도 입력할 수 있습니다.</span></div><div class="signature">발신: 신성어패럴</div></section><p class="small no-print">A4 가로 출력용 · 입력 내용은 서버에 저장되지 않습니다. 엑셀/PNG 생성은 인터넷 연결이 필요합니다.</p></main><script>
const sizes=['S','M','L','XL','2XL','3XL','4XL','5XL','6XL','7XL'],tb=document.getElementById('items');const val=x=>Math.max(0,Math.floor(Number(x)||0));const dt=new Date();document.getElementById('issued').value=[dt.getFullYear(),String(dt.getMonth()+1).padStart(2,'0'),String(dt.getDate()).padStart(2,'0')].join('-');
function addRow(d={}){const tr=document.createElement('tr');tr.innerHTML='<td><input class="date" type="date" aria-label="납품날짜"></td><td><input class="item" placeholder="품목" aria-label="품목"></td><td><input class="style" placeholder="스타일 번호" aria-label="스타일 번호"></td>'+sizes.map(z=>`<td><input class="qty" type="number" min="0" step="1" placeholder="-" aria-label="${z} 수량"></td>`).join('')+'<td class="rowtotal">0</td><td class="delete-col"><button class="delete" type="button">×</button></td>';tb.append(tr);tr.querySelector('.date').value=d.date||'';tr.querySelector('.item').value=d.item||'';tr.querySelector('.style').value=d.style||'';tr.querySelectorAll('.qty').forEach((e,i)=>e.value=d.qty?.[i]??'');tr.querySelectorAll('input').forEach(e=>e.addEventListener('input',calc));tr.querySelector('.delete').onclick=()=>{tr.remove();if(!tb.children.length)addRow();calc()};calc()}
function data(){return [...tb.children].map(tr=>({date:tr.querySelector('.date').value,item:tr.querySelector('.item').value,style:tr.querySelector('.style').value,qty:[...tr.querySelectorAll('.qty')].map(e=>val(e.value))}))}function calc(){const sums=Array(10).fill(0);[...tb.children].forEach(tr=>{let n=0;tr.querySelectorAll('.qty').forEach((e,i)=>{const q=val(e.value);n+=q;sums[i]+=q});tr.querySelector('.rowtotal').textContent=n.toLocaleString('ko-KR')});sums.forEach((n,i)=>document.getElementById('sum'+i).textContent=n.toLocaleString('ko-KR'));document.getElementById('grand').textContent=sums.reduce((a,b)=>a+b,0).toLocaleString('ko-KR')};document.getElementById('add').onclick=()=>addRow();for(let i=0;i<6;i++)addRow();
const clean=s=>(s||'수신처').replace(/[\\/:*?"<>|]/g,'_');function saveBlob(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
document.getElementById('excel').onclick=async()=>{if(!window.ExcelJS){alert('엑셀 도구를 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.');return}const btn=document.getElementById('excel');btn.disabled=true;try{const wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('사이즈별 납품명세서',{pageSetup:{paperSize:9,orientation:'landscape',fitToPage:true,fitToWidth:1,fitToHeight:1,margins:{left:.2,right:.2,top:.35,bottom:.35,header:.1,footer:.1}}});ws.columns=[{width:15},{width:19},{width:20},...sizes.map(()=>({width:8})),{width:12}];ws.mergeCells('A1:N2');ws.getCell('A1').value='사 이 즈 별 납 품 명 세 서';ws.getCell('A1').font={name:'맑은 고딕',size:18,bold:true};ws.getCell('A1').alignment={horizontal:'center',vertical:'middle'};ws.getRow(1).height=24;ws.getRow(2).height=24;ws.getCell('A4').value='수신';ws.getCell('B4').value=document.getElementById('recipient').value;ws.getCell('D4').value='발신';ws.getCell('E4').value='신성어패럴';ws.getCell('A5').value='작성일';ws.getCell('B5').value=document.getElementById('issued').value;['납품날짜','품목','스타일 번호',...sizes,'총수량'].forEach((v,i)=>ws.getCell(7,i+1).value=v);const rows=data();rows.forEach((r,i)=>{const n=8+i;[r.date,r.item,r.style,...r.qty].forEach((v,j)=>ws.getCell(n,j+1).value=v);ws.getCell(n,14).value={formula:`SUM(D${n}:M${n})`,result:r.qty.reduce((a,b)=>a+b,0)};ws.getRow(n).height=22});const t=8+rows.length;ws.mergeCells(`A${t}:C${t}`);ws.getCell(t,1).value='사이즈별 합계';for(let c=4;c<=14;c++){const letter=ws.getColumn(c).letter;ws.getCell(t,c).value={formula:`SUM(${letter}8:${letter}${t-1})`,result:rows.reduce((a,r)=>a+(c===14?r.qty.reduce((x,y)=>x+y,0):r.qty[c-4]),0)}}ws.getRow(t).height=25;ws.eachRow((row,n)=>row.eachCell({includeEmpty:true},cell=>{if(n>=7&&n<=t){cell.border={top:{style:'thin'},bottom:{style:'thin'},left:{style:'thin'},right:{style:'thin'}};if(n===7||n===t)cell.fill={type:'pattern',pattern:'solid',fgColor:{argb:'FFEAF0F8'}}}cell.alignment={horizontal:n>=7?'center':'left',vertical:'middle'};cell.font={name:'맑은 고딕',size:9,bold:n===7||n===t}}));ws.printArea=`A1:N${t}`;const b=await wb.xlsx.writeBuffer();saveBlob(new Blob([b],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),`사이즈별_납품명세서_${clean(document.getElementById('recipient').value)}.xlsx`)}catch(e){console.error(e);alert('엑셀 생성 오류가 발생했습니다.')}finally{btn.disabled=false}};
document.getElementById('png').onclick=async()=>{if(!window.html2canvas){alert('이미지 도구를 불러오지 못했습니다.');return}const btn=document.getElementById('png');btn.disabled=true;let holder;try{holder=document.createElement('div');holder.style.cssText='position:fixed;left:-10000px;top:0;width:1300px;background:white;padding:30px;z-index:-1';const clone=document.getElementById('document').cloneNode(true);clone.style.cssText='box-shadow:none;border-radius:0;padding:0;width:100%';const orig=document.querySelectorAll('#document input'),ins=clone.querySelectorAll('input');ins.forEach((e,i)=>{const span=document.createElement('span');span.textContent=orig[i].value||'';span.style.cssText='display:block;min-height:20px;overflow-wrap:anywhere';e.replaceWith(span)});clone.querySelectorAll('.delete-col,.row-actions').forEach(e=>e.remove());clone.querySelector('.scroll').style.overflow='visible';clone.querySelector('table').style.minWidth='0';holder.append(clone);document.body.append(holder);const canvas=await html2canvas(holder,{scale:2,backgroundColor:'#fff',width:1300,windowWidth:1400});const blob=await new Promise(r=>canvas.toBlob(r,'image/png'));if(!blob)throw Error('PNG 변환 실패');const name=`사이즈별_납품명세서_${clean(document.getElementById('recipient').value)}.png`;const file=new File([blob],name,{type:'image/png'});if(/iPhone|iPad|iPod/.test(navigator.userAgent)&&navigator.canShare?.({files:[file]})){try{await navigator.share({files:[file],title:name});return}catch(e){if(e.name==='AbortError')return}}saveBlob(blob,name)}catch(e){console.error(e);alert('PNG 생성 오류가 발생했습니다.')}finally{holder?.remove();btn.disabled=false}};
</script></body></html>
